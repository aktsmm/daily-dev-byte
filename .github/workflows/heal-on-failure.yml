name: Heal on failure

# No AI. Tool-denial failures are re-dispatched in safe mode (no shell use);
# other failures are re-run once. If no retry is left, a single alert issue is
# opened instead of failing silently.
on:
  workflow_run:
    workflows: ["Daily Dev Byte Publisher"]
    types: [completed]

permissions:
  actions: write
  issues: write
  contents: read

concurrency:
  group: heal-on-failure
  cancel-in-progress: false

jobs:
  heal:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      RUN_EVENT: ${{ github.event.workflow_run.event }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: .github/scripts
      - name: Classify and retry
        id: retry
        run: |
          mode=$(gh run view "$RUN_ID" --log 2>/dev/null | node .github/scripts/classify-failure.js "$RUN_EVENT" "$ATTEMPT")
          echo "failure class: $mode (event=$RUN_EVENT attempt=$ATTEMPT)"
          if [ "$mode" = "safe" ]; then
            gh workflow run daily-dev-byte.lock.yml -f safe_mode=true
          elif [ "$mode" = "rerun" ]; then
            gh run rerun "$RUN_ID" --failed
          fi
          echo "retry=$mode" >> "$GITHUB_OUTPUT"
      - name: Open an alert issue when no retry is left
        if: steps.retry.outputs.retry == 'none'
        run: |
          title="Daily Dev Byte publisher is failing"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number -q 'length')
          if [ "${open:-0}" = "0" ]; then
            gh issue create --title "$title" \
              --body "The publisher failed again after an automatic retry: $RUN_URL"
          else
            echo "alert issue already open"
          fi
